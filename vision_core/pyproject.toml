[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mtc-vision-core"
version = "0.4.0"
description = "Battery RGB-D vision diagnostic candidates; no robot control"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "opencv-python>=4.8", "PyYAML>=6", "matplotlib>=3.8"]
[project.optional-dependencies]
test = ["pytest>=8"]
realsense = ["pyrealsense2>=2.50"]
cad = ["cadquery-ocp==7.7.2"]
[tool.setuptools.packages.find]
where = ["."]
include = ["perception*", "input*", "cad_geometry*", "synthetic*", "evaluation*", "real_data*", "scripts*", "config*"]
[tool.setuptools.package-data]
config = ["*.yaml"]
